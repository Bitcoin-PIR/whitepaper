name: Whitepaper build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reproducible-pdf:
    runs-on: ubuntu-24.04
    env:
      SOURCE_DATE_EPOCH: "0"
      TZ: UTC
      OPEN_PDF: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            fonts-linuxlibertine \
            texlive-bibtex-extra \
            texlive-fonts-extra \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-xetex
      - name: Build twice from clean copies
        run: |
          mkdir -p /tmp/whitepaper-a /tmp/whitepaper-b
          tar --exclude=.git --exclude=main.pdf -cf - . | tar -xf - -C /tmp/whitepaper-a
          tar --exclude=.git --exclude=main.pdf -cf - . | tar -xf - -C /tmp/whitepaper-b
          (cd /tmp/whitepaper-a && ./build.sh)
          (cd /tmp/whitepaper-b && ./build.sh)
          sha256sum /tmp/whitepaper-a/main.pdf /tmp/whitepaper-b/main.pdf
          cmp /tmp/whitepaper-a/main.pdf /tmp/whitepaper-b/main.pdf
      - name: Upload generated paper
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: whitepaper
          path: /tmp/whitepaper-a/main.pdf
          if-no-files-found: error
